[project]
name = "tiny-ml-pipeline"
version = "0.1.0"
description = "A minimal end-to-end sklearn pipeline as a reference implementation."
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pandas>=1.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
